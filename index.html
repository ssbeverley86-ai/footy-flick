<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Footy Flick</title><style>*{box-sizing:border-box}body{margin:0;background:#101c19;color:white;font:16px system-ui;display:flex;justify-content:center}main{width:min(100vw,480px);padding:12px}header{display:flex;justify-content:space-between;align-items:center}h2{margin:4px 0}canvas{width:100%;height:auto;touch-action:none;border-radius:16px;display:block}button{background:#25453a;color:white;border:1px solid #527b68;border-radius:12px;padding:12px;font:inherit;flex:1}button:disabled{opacity:.35}button.on{background:#d8e9a4;color:#182b20}nav{display:flex;gap:8px;margin:8px 0}#info{font-size:13px;color:#c6d8cb;min-height:36px}#result{text-align:center;font-weight:bold;min-height:26px}</style></head><body><main><header><h2>FOOTY FLICK <small style="font-size:11px">V0.03</small></h2><b id="score">0 pts</b></header><nav><button id="trad" class="on">Traditional</button><button id="arc">Arcade</button></nav><div id="info"></div><canvas id="c" width="420" height="570"></canvas><div id="result">Flick the ball toward the target</div><nav><button id="air" class="on">Air</button><button id="ground">Ground</button><button id="next">Restart</button></nav><small>Swipe from the ball. Speed controls power; start left or right of centre to bend the ball. Curved swipes add spin. Aim into the wind. Bins require an airborne landing.</small></main><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),$=id=>document.getElementById(id);let mode='trad',ground=false,i=0,score=0,flight=null,start=null,done=false,raf=0;const shots=[[35,0,0,0],[40,-16,8,0],[50,8,-12,0],[45,19,15,-5],[55,-12,-9,10],[50,21,18,-8]],arcShots=[[28,0,0,0],[32,-6,7,0],[36,5,-9,0],[40,-8,12,-4],[44,6,-12,5],[48,9,15,-5]];let shot=shots[0];const bx=210,by=480;function project(x,y,z){let d=1/(1+y/22);return [210+(x-shot[1])*9*d,480-465*(1-d)-z*9*d,d]};function line(a,b,col,w){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()};function ball(x,y,r,lean,phase,spin=0){
// Orthographic projection of a rotating leather prolate spheroid. Pitch is end-over-end; lean is independent.
const pitch=phase, yaw=spin*.48, cp=Math.cos(pitch),sp=Math.sin(pitch),cl=Math.cos(lean),sl=Math.sin(lean),cy=Math.cos(yaw),sy=Math.sin(yaw);
function transform(X,Y,Z){let a=X*cy+Z*sy,b=Y,c=-X*sy+Z*cy;let B=b*cp-c*sp,C=b*sp+c*cp;return [a*cl-B*sl,a*sl+B*cl,C]}
function pt(t,u){return transform(.57*Math.sin(t)*Math.cos(u),Math.cos(t),.57*Math.sin(t)*Math.sin(u))}
function path(points){g.beginPath();points.forEach((v,i)=>{let X=x+v[0]*r,Y=y-v[1]*r;i?g.lineTo(X,Y):g.moveTo(X,Y)});g.closePath()}
let faces=[];for(let j=0;j<18;j++)for(let k=0;k<24;k++){let t=j*Math.PI/18,T=(j+1)*Math.PI/18,u=k*Math.PI/12,U=(k+1)*Math.PI/12;let v=[pt(t,u),pt(T,u),pt(T,U),pt(t,U)];let z=v.reduce((s,a)=>s+a[2],0)/4;let n=transform(Math.sin((t+T)/2)*Math.cos((u+U)/2)/.57,Math.cos((t+T)/2),Math.sin((t+T)/2)*Math.sin((u+U)/2)/.57);let l=Math.max(0,(n[0]*-.4+n[1]*.5+n[2]*.8)/Math.hypot(...n));faces.push({v,z,l,k})}faces.sort((a,b)=>a.z-b.z);for(let f of faces){path(f.v);let L=f.l;g.fillStyle=`rgb(${Math.round(92+133*L)},${Math.round(22+61*L)},${Math.round(17+43*L)})`;g.fill();g.strokeStyle=g.fillStyle;g.lineWidth=.65;g.stroke()}
function seam(points,col,w){g.strokeStyle=col;g.lineWidth=w;g.beginPath();let active=false;for(let v of points){if(v[2]<.025){active=false;continue}let X=x+v[0]*r,Y=y-v[1]*r;active?g.lineTo(X,Y):g.moveTo(X,Y);active=true}g.stroke()}
for(let u of [0,Math.PI/2,Math.PI,Math.PI*1.5])seam(Array.from({length:65},(_,j)=>pt(j*Math.PI/64,u)),'#59231c',Math.max(.7,r*.025));
seam(Array.from({length:35},(_,j)=>pt(1.05+j*.031,Math.PI/2)),'#f1d2a5',Math.max(1,r*.035));for(let j=0;j<8;j++)seam(Array.from({length:12},(_,k)=>pt(1.13+j*.125,Math.PI/2-.18+k*.033)),'#ffe3bc',Math.max(1,r*.04));
}function draw(){let sky=g.createLinearGradient(0,0,0,180);sky.addColorStop(0,'#80b7d0');sky.addColorStop(1,'#e2e5cb');g.fillStyle=sky;g.fillRect(0,0,420,570);g.fillStyle='#354b45';g.fillRect(0,85,420,65);for(let j=0;j<420;j+=9){g.fillStyle=['#a6a99c','#617d79','#c3b5a0'][j%3];g.fillRect(j,95+(j%17),5,5)}g.fillStyle='#377a3d';g.fillRect(0,150,420,420);for(let y=0;y<100;y+=8){let a=project(0,y,0)[1],b=project(0,y+4,0)[1];g.fillStyle='#418747';g.fillRect(0,b,420,a-b)}let dist=shot[0];let goal=project(0,dist,0);if(mode==='trad'){for(let x of [-9.6,-3.2,3.2,9.6]){let a=project(x,dist,0),b=project(x,dist,Math.abs(x)<4?10:6);line(a.slice(0,2),b.slice(0,2),'#f5f5e8',Math.max(2,5*a[2]))}line(project(-9.6,dist,0).slice(0,2),project(9.6,dist,0).slice(0,2),'#eee',2)}else{let [x,y,d]=goal;g.fillStyle='#e0b63b';g.fillRect(x-7.65*d,y-10.35*d,15.3*d,10.35*d);g.fillStyle='#233b28';g.fillRect(x-7.65*d,y-10.35*d,15.3*d,3*d);g.strokeStyle='#fff4a3';g.strokeRect(x-7.65*d,y-10.35*d,15.3*d,10.35*d)}g.fillStyle='#ffffffd0';g.font='bold 14px system-ui';g.fillText('WIND '+(shot[2]>0?'→':shot[2]<0?'←':'—')+' '+Math.abs(shot[2])+' m/s'+(shot[3]?' / '+Math.abs(shot[3])+' '+(shot[3]>0?'tail':'head'):'') ,14,25);if(flight){let [x,y,d]=project(flight.x,flight.y,flight.z);let shadow=project(flight.x,flight.y,0);g.fillStyle='#0004';g.beginPath();g.ellipse(shadow[0],shadow[1],13*d,4*d,0,0,7);g.fill();ball(x,y,Math.max(8,38*d),flight.rot,flight.phase,flight.spin)}else if(!done){ball(bx,by,47,Math.atan2(-shot[1],shot[0])*.9+(ground?1.1:0),0);if(start){line([start.x,start.y],[start.lastX,start.lastY],'#fff9',2)}}}function setup(){cancelAnimationFrame(raf);flight=null;start=null;done=false;shot=(mode==='arc'?arcShots:shots)[i%shots.length];if(mode==='arc')ground=false;$('ground').disabled=mode==='arc';$('air').classList.toggle('on',!ground);$('ground').classList.toggle('on',ground);$('info').textContent=`Kick ${i+1}/6 • ${shot[0]} m • ${shot[1]===0?'Straight':shot[1]<0?'Left angle':'Right angle'}`;$('score').textContent=score+' pts';$('result').textContent='Flick the ball toward the target';$('next').textContent='Restart';draw()}function reset(){i=score=0;setup()}function finish(p){done=true;score+=p;$('score').textContent=score+' pts';$('result').textContent=(p===6?'GOAL! +6':p===1?'BEHIND +1':'MISS')+(i===5?' • Round complete: '+score+'/36':'');$('next').textContent=i===5?'Play again':'Next kick';if(i===5){let k='best-'+mode;try{let best=Math.max(score,+(localStorage.getItem(k)||0));localStorage.setItem(k,best);$('result').textContent+=' • Best '+best}catch(e){}}draw()}function step(t){let f=flight;if(!f||done)return;let dt=Math.min(.025,(t-f.last)/1000||.016);f.last=t;f.time+=dt;let prev=f.y,px=f.x,pz=f.z;let gust=1+.25*Math.sin(f.time*4);f.vx+=(f.spin*(ground?3.0:3.8)+shot[2]*(ground?.035:.65)*gust)*dt;f.vy+=shot[3]*(ground?.025:.38)*gust*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.z+=f.vz*dt;f.vz-=9.81*dt;if(f.z<0){f.z=0;f.vz=Math.abs(f.vz)*(ground?.26:.42);f.vy*=ground?.91:.75;f.vx*=.9;if(f.vz<.5)f.vz=0}if(f.z===0){f.vy*=Math.pow(.78,dt);f.vx*=Math.pow(.78,dt)}let lean=Math.max(-.85,Math.min(.85,shot[2]*.028+f.spin*.40));f.rot+=(lean-f.rot)*Math.min(1,dt*4);f.phase+=dt*(ground?Math.hypot(f.vx,f.vy)*2.4:8.5);draw();if(mode==='trad'&&prev<shot[0]&&f.y>=shot[0]){let a=Math.abs(px+(f.x-px)*(shot[0]-prev)/(f.y-prev));finish(a<3.2?6:a<9.6?1:0);return}if(mode==='arc'){if(pz>=1.15&&f.z<1.15&&f.vz<0){let k=(pz-1.15)/(pz-f.z),xx=px+(f.x-px)*k,yy=prev+(f.y-prev)*k;if(Math.abs(xx)<.65&&Math.abs(yy-shot[0])<.65){finish(6);return}}if(f.z<1.15&&Math.abs(f.x)<.85&&Math.abs(f.y-shot[0])<.85){finish(1);return}if(f.y>shot[0]+5){finish(0);return}}if(f.time>9||f.vy<.7||Math.abs(f.x)>65){finish(0);return}raf=requestAnimationFrame(step)}function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*420/r.width,y:(e.clientY-r.top)*570/r.height}}c.onpointerdown=e=>{if(flight||done)return;let p=pos(e);if(Math.hypot(p.x-bx,p.y-by)>65)return;start={...p,lastX:p.x,lastY:p.y,points:[p],t:performance.now()};c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(start){let p=pos(e);start.lastX=p.x;start.lastY=p.y;start.points.push(p);draw()}};c.onpointercancel=()=>{start=null;draw()};c.onpointerup=e=>{if(!start)return;let p=pos(e),dx=p.x-start.x,dy=start.y-p.y,elapsed=Math.max(65,performance.now()-start.t),offset=(start.x-bx)/36;let bend=0;for(let q of start.points){let u=(start.y-q.y)/Math.max(1,dy);if(u>.15&&u<.85){let v=(start.x+dx*u-q.x);if(Math.abs(v)>Math.abs(bend))bend=v}}let spin=Math.max(-1.5,Math.min(1.5,(Math.abs(offset)<.16?0:offset)*1.35+bend/20));start=null;if(dy<15){draw();return}let power=Math.min(1,Math.hypot(dx,dy)/230*.65+Math.hypot(dx,dy)/elapsed*.35);let speed=8+power*25;let angle=Math.atan2(dx,dy);flight={x:shot[1],y:0,z:ground?.35:1.2,vx:Math.sin(angle)*speed,vy:Math.cos(angle)*speed,vz:ground?1.6:5+power*11,spin:spin,rot:Math.atan2(-shot[1],shot[0])*.9,phase:0,time:0,last:performance.now()};$('result').textContent=`Power ${Math.round(power*100)}% • Spin ${spin<-.15?'LEFT':spin>.15?'RIGHT':'STRAIGHT'} ${Math.round(Math.abs(spin)/1.5*100)}%`;raf=requestAnimationFrame(step)};$('next').onclick=()=>{if(done&&i<5){i++;setup()}else reset()};for(let m of ['trad','arc'])$(m).onclick=()=>{mode=m;$('trad').classList.toggle('on',m==='trad');$('arc').classList.toggle('on',m==='arc');reset()};for(let m of ['air','ground'])$(m).onclick=()=>{if(flight|| (mode==='arc'&&m==='ground'))return;ground=m==='ground';$('air').classList.toggle('on',!ground);$('ground').classList.toggle('on',ground);draw()};setup();</script></body></html>
