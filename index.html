const target=new T.Group();scene.add(target);const field=new T.Group();scene.add(field);function targetBuild(){target.clear();field.clear();if(mode==='arc'){let bin=mat(0x287d51),rim=mat(0x132d24);box(1.3,1.15,.12,bin,0,.575,-.65,target);box(1.3,1.15,.12,bin,0,.575,.65,target);for(let x of [-.65,.65])box(.12,1.15,1.3,bin,x,.575,0,target);box(1.4,.08,.12,rim,0,1.16,.65,target);box(1.4,.08,.12,rim,0,1.16,-.65,target);for(let x of [-.65,.65])box(.12,.08,1.4,rim,x,1.16,0,target)}else{for(let x of [-9.6,-3.2,3.2,9.6]){let h=Math.abs(x)<4?12:7;mesh(new T.CylinderGeometry(.095,.095,h,12),white,x,h/2,0,target);box(.35,1.4,.35,mat(0x233d5d),x,.7,0,target)}box(19.2,.025,.09,white,0,.025,0,target);let pts=[];for(let j=0;j<=60;j++){let a=-1.15+2.3*j/60;pts.push(new T.Vector3(50*Math.sin(a),.025,-shot[0]+50*Math.cos(a)))}let o=mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),80,.045,5,false),white,0,0,0,field)}target.position.z=-shot[0]}

let mode='trad',practice=false,ground=false,slow=false,i=0,score=0,shot,flight=null,done=false,start=null,lastKick=null,windOverride=null;const shots=[[35,0,0],[43,-18,8],[50,10,-12],[45,22,15],[55,-15,-10],[52,20,18]],arcShots=[[30,0,0],[35,-5,8],[38,6,-10],[42,-8,12],[45,7,-12],[48,9,15]];let q=new T.Quaternion(), axis=new T.Vector3(), leanQ=new T.Quaternion(), origin=new T.Vector3(), screen=new T.Vector3();function resize(){let w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();function cameraReady(){cam.position.set(shot[1],2.2,2.8);cam.lookAt(0,1.5,-shot[0]);cam.updateMatrixWorld();let p=new T.Vector3(0,-.55,.5).unproject(cam);let dir=p.sub(cam.position).normalize();origin.copy(cam.position).addScaledVector(dir,1.05);ball.position.copy(origin);ball.scale.setScalar(1.25);q.setFromAxisAngle(new T.Vector3(0,0,1),Math.atan2(-shot[1],shot[0])*.55);ball.quaternion.copy(q);shadow.visible=false}function setup(){flight=null;done=false;start=null;shot=[...(mode==='arc'?arcShots:shots)[i%6]];if(windOverride!==null)shot[2]=windOverride;if(mode==='arc')ground=false;$('ground').disabled=mode==='arc';$('ground').classList.toggle('on',ground);$('air').classList.toggle('on',!ground);$('distance').textContent=`${shot[0]} m · ${practice?'Practice':`Kick ${i+1}/6`}`;$('wind').textContent=`${shot[2]<0?'←':'→'} ${Math.round(Math.abs(shot[2])*3.6)} km/h`;$('score').textContent=score+' / 36';$('result').textContent='Ready to kick';$('next').textContent=practice?'Reset shot':'Restart';$('guide').style.display='block';targetBuild();cameraReady()}function finish(p){done=true;if(!practice)score+=p;$('score').textContent=score+' / 36';$('result').textContent=p===6?'GOAL · +6':p===1?'BEHIND · +1':'MISS · 0';if(!practice&&i===5)$('result').textContent+=' · Round complete';$('next').textContent=practice?'Try again':i===5?'Play again':'Next kick'}
